#      - "C:/Users/vshalaev/Documents/PROJECT/Kafka/Offset_explorer/new_sert/cert_jks/kafka.truststore.jks:/opt/spark/conf/kafka.truststore.jks"
#      - "C:/Users/vshalaev/Documents/PROJECT/Kafka/Offset_explorer/new_sert/ca.crt:/opt/spark/conf/client.crt"
#      - "C:/Users/vshalaev/Documents/PROJECT/Kafka/Offset_explorer/new_sert/cert.pem:/opt/spark/conf/ca-cert.pem"
#      - "C:/Users/vshalaev/Documents/PROJECT/Kafka/Offset_explorer/new_sert/key.pem:/opt/spark/conf/client.key"
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=default
#      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:8123/ping"]
#      interval: 5s
#      timeout: 10s
#      retries: 20
#    ulimits:
#      nofile:
#        soft: 262144
#        hard: 262144
    restart: unless-stopped
    depends_on:
      - broker-1
      - broker-2
      - broker-3

#  clickhouse-server:
#    image: clickhouse/clickhouse-server:latest
#    container_name: clickhouse
#    ports:
#      - "8123:8123"
#    environment:
#      CLICKHOUSE_USER: "default"
#      CLICKHOUSE_PASSWORD: ""
#      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
##    healthcheck:
##      test: ["CMD", "curl", "-f", "http://localhost:8123/ping"]
##      interval: 5s
##      timeout: 10s
##      retries: 30
#    restart: on-failure

  kafka-consumer:
    image: st45/kafka-consumer
    container_name: kafka-consumer-service
    ports:
      - "8081:8080"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "broker-1:19092,broker-2:19092,broker-3:19092"
      SPRING_KAFKA_CONSUMER_GROUP_ID: "clickhouse-group"
      KAFKA_TOPIC: "sandbox"
      CLICKHOUSE_URL: "jdbc:clickhouse://clickhouse-server:8123/default"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: "default"
      CLICKHOUSE_BATCH_SIZE: "1000"
      CLICKHOUSE_BATCH_TIMEOUT_MS: "5000"
      SPRING_DATASOURCE_CLICKHOUSE_URL: "jdbc:clickhouse://clickhouse-server:8123/default"
      SPRING_DATASOURCE_CLICKHOUSE_USERNAME: "default"
      SPRING_DATASOURCE_CLICKHOUSE_PASSWORD: "default"
      SPRING_DATA_REDIS_HOST: redis-for-kafka
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_TIMEOUT: 5000
      SPRING_DATA_REDIS_DATABASE: 0
      KAFKA_DLQ_TOPIC_NAME: "dlq_messages"
      KAFKA_USQ_TOPIC_NAME: "usq_messages"
    depends_on:
      broker-1:
        condition: service_started
      broker-2:
        condition: service_started
      broker-3:
        condition: service_started
#      clickhouse-server:
#        condition: service_healthy
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  clickhouse_data:
  redis_for_kafka_data:
  postgres_data:
  prometheus_data:
  grafana_data:
  # Kafka brokers data volumes
